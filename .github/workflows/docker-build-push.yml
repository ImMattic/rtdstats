name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - staging

jobs:
  set-tags:
    name: Compute Image Tags
    runs-on: ubuntu-latest
    outputs:
      backend_tags: ${{ steps.tags.outputs.backend_tags }}
      frontend_tags: ${{ steps.tags.outputs.frontend_tags }}
    steps:
      - name: Compute tags
        id: tags
        run: |
          USER=${{ secrets.DOCKERHUB_USERNAME }}
          SHA=${{ github.sha }}
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "backend_tags=${USER}/rtdstats-backend:latest,${USER}/rtdstats-backend:${SHA}" >> "$GITHUB_OUTPUT"
            echo "frontend_tags=${USER}/rtdstats-frontend:latest,${USER}/rtdstats-frontend:${SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "backend_tags=${USER}/rtdstats-backend:staging,${USER}/rtdstats-backend:staging-${SHA}" >> "$GITHUB_OUTPUT"
            echo "frontend_tags=${USER}/rtdstats-frontend:staging,${USER}/rtdstats-frontend:staging-${SHA}" >> "$GITHUB_OUTPUT"
          fi

  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: set-tags
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ needs.set-tags.outputs.backend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: set-tags
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ needs.set-tags.outputs.frontend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
