name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - staging

env:
  REGISTRY: docker.io

jobs:
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          USER=${{ secrets.DOCKERHUB_USERNAME }}
          SHA=${{ github.sha }}
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tags=${USER}/transitden-backend:latest,${USER}/transitden-backend:${SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${USER}/transitden-backend:staging,${USER}/transitden-backend:staging-${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          USER=${{ secrets.DOCKERHUB_USERNAME }}
          SHA=${{ github.sha }}
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tags=${USER}/transitden-frontend:latest,${USER}/transitden-frontend:${SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${USER}/transitden-frontend:staging,${USER}/transitden-frontend:staging-${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: BACKEND_URL=http://backend:8000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
