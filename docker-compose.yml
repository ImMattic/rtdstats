services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    # Tuned for a small VM (~4 GB RAM). TimescaleDB's image entrypoint applies
    # these via -c flags. shared_buffers ~25% RAM, effective_cache_size ~50%.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=768MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "max_connections=50"
    environment:
      POSTGRES_DB: rtdstats
      POSTGRES_USER: rtdstats
      POSTGRES_PASSWORD: rtdstats
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtdstats -d rtdstats"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 768M

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://rtdstats:rtdstats@db:5432/rtdstats
      GTFS_RT_VEHICLE_URL: https://www.rtd-denver.com/files/gtfs-rt/VehiclePosition.pb
      GTFS_RT_TRIP_URL: https://www.rtd-denver.com/files/gtfs-rt/TripUpdate.pb
      POLLING_INTERVAL_SECONDS: "10"
      STUCK_VEHICLE_MINUTES: "5"
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount static GTFS data so the ingestion service can read it
      - ./gtfs-static:/app/gtfs-static:ro
    deploy:
      resources:
        limits:
          memory: 1024M

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Server-side proxy target — Next.js rewrites /api/* to this URL.
      # Uses the Compose service name; never exposed to the browser.
      BACKEND_URL: http://backend:8000
      CARTO_API_KEY: ${CARTO_API_KEY:-}
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
